<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторна робота №1</title>
    <style>
        body {
            margin: 0;
            padding: 32px 16px;
            font: 16px/1.6 Arial, sans-serif;
            background: #edf2f8;
            color: #172b42;
        }

        main {
            max-width: 640px;
            margin: 24px auto;
            padding: clamp(20px, 5vw, 40px);
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin: 0 0 12px;
            color: #204b79;
            font-size: clamp(28px, 6vw, 40px);
            line-height: 1.2;
        }

        h2 { font-size: 20px; }
    </style>
</head>
<body>
    <main>
        <h1>Лабораторна робота №1</h1>
        <p>Ознайомлення з середовищем та базовими інструментами</p>

        <h2>Мета роботи</h2>
        <p>Ознайомитися з основами веброзробки та створити просту вебсторінку.</p>

        <h2>Використані технології</h2>
        <ul>
            <li>HTML5 для структури сторінки.</li>
            <li>CSS3 для оформлення сторінки.</li>
        </ul>
    </main>
</body>
</html>
